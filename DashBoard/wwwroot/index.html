<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GRCS 控制面板</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
</head>
<body>
    <div id="app">Loading...</div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script>
        // ────────────────────────────────────────────────────────────────
        // JS 桥层（Blazor WASM ↔ localStorage / 浏览器能力）
        //
        // 为什么把持久化放这里：WASM 的 IJSRuntime 调用是异步且带序列化开销的，
        // C# 侧用 LocalStoreService 预加载小 key 进内存、大台账/地图走后端 SQLite，
        // 全部通过本文件暴露的 window.grcs* 函数读写 localStorage。
        // ────────────────────────────────────────────────────────────────
        window.grcsCopyText = (text) => navigator.clipboard.writeText(text);

        // generic localStorage helpers
        window.grcsStoreSave = (key, json) => localStorage.setItem(key, json);
        // batch load: pass JSON array of keys → returns JSON object {key: value, ...}
        window.grcsStoreLoadAll = (keysJson) => {
            let keys = [];
            try { keys = JSON.parse(keysJson); } catch { return '{}'; }
            const result = {};
            for (const k of keys) result[k] = localStorage.getItem(k);
            return JSON.stringify(result);
        };

        // generic sessionStorage helpers（按标签页隔离：同一标签页刷新/重进保留，新开标签页为新值）
        window.grcsSessionSave = (key, value) => sessionStorage.setItem(key, value);
        window.grcsSessionLoad = (key) => sessionStorage.getItem(key);
    </script>
<script src="station-map-picker.js"></script>
        <script src="nest-map-picker.js"></script>
<script src="js/signalr.min.js"></script>
<script src="js/signalr-taskstage.js"></script>
    <script src="js/download-helper.js"></script>
<script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>
</html>
